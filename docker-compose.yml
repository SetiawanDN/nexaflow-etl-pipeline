services:

  postgres:
    image: postgres:15
    container_name: nexaflow_postgres

    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa123
      POSTGRES_DB: nexaflow_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: nexaflow_app

    depends_on:
      - postgres

    ports:
      - "8501:8501"

volumes:
  postgres_data: